<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>Message from Eduwins</title>
  </head>
  <body style="margin:0;padding:0;background-color:#F5F7FC;font-family:Arial,Helvetica,sans-serif;color:#111827;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">A message from the Eduwins team for {{firstName}}.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#F5F7FC;">
      <tr>
        <td align="center" style="padding:36px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:640px;background-color:#ffffff;border:1px solid #E6EAF5;border-radius:28px;overflow:hidden;">
            <tr>
              <td style="background-color:#001A72;padding:34px 34px 30px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td>
                      <span style="display:inline-block;background-color:#FFB81C;color:#001A72;border-radius:999px;padding:8px 14px;font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;">Eduwins</span>
                    </td>
                    <td align="right" style="color:#ffffff;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.76;">Announcement</td>
                  </tr>
                </table>
                <h1 style="margin:24px 0 0;color:#ffffff;font-size:30px;line-height:1.15;font-weight:900;letter-spacing:-.4px;">Hello {{firstName}}</h1>
              </td>
            </tr>

            <tr>
              <td style="padding:32px 34px 8px;">
                <div style="color:#374151;font-size:15px;line-height:1.7;">{{body}}</div>
              </td>
            </tr>

            <tr>
              <td style="padding:12px 34px 34px;">
                <p style="margin:0;color:#6B7280;font-size:13px;line-height:1.7;text-align:center;">This announcement was sent by the Eduwins team to {{roleLabel}} accounts.</p>
              </td>
            </tr>
          </table>
          <p style="margin:18px 0 0;color:#9CA3AF;font-size:12px;line-height:1.6;text-align:center;">Eduwins · Helping families connect with trusted tutors</p>
        </td>
      </tr>
    </table>
  </body>
</html>
